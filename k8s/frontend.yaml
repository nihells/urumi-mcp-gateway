apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-frontend
  namespace: urumi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urumi-frontend
  template:
    metadata:
      labels:
        app: urumi-frontend
    spec:
      containers:
        - name: frontend
          image: urumi-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: urumi-frontend
  namespace: urumi
spec:
  type: ClusterIP
  selector:
    app: urumi-frontend
  ports:
    - name: http
      port: 80
      targetPort: http