apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: urumi-backend-data
  namespace: urumi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-backend
  namespace: urumi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urumi-backend
  template:
    metadata:
      labels:
        app: urumi-backend
    spec:
      containers:
        - name: backend
          image: urumi-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: urumi-backend-secrets
                  key: jwt-secret
            - name: OLLAMA_URL
              value: "http://host.docker.internal:11434"
            - name: OLLAMA_MODEL
              value: "llama3.2:3b"
            - name: DATABASE_URL
              value: "sqlite:////app/data/urumi.db"
          volumeMounts:
            - name: backend-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: urumi-backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: urumi-backend
  namespace: urumi
spec:
  type: ClusterIP
  selector:
    app: urumi-backend
  ports:
    - name: http
      port: 8001
      targetPort: http
