apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urumi-frontend
  namespace: urumi
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.urumi.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urumi-frontend
                port:
                  number: 80