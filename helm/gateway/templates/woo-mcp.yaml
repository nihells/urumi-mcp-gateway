{{- if .Values.wooMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.wooMcp.serviceName }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.wooMcp.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.wooMcp.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.wooMcp.serviceName }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woo-mcp-server
          image: {{ .Values.wooMcp.image }}
          imagePullPolicy: {{ .Values.wooMcp.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.wooMcp.servicePort }}
          env:
            - name: WOOCOMMERCE_URL
              value: {{ .Values.wooMcp.wordpressUrl | quote }}
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wooMcp.credentials.existingSecret }}
                  key: {{ .Values.wooMcp.credentials.consumerKey }}
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wooMcp.credentials.existingSecret }}
                  key: {{ .Values.wooMcp.credentials.consumerSecret }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.wooMcp.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
{{- end }}