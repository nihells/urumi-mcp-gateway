apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-wordpress-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.wordpress.storageClass }}
  resources:
    requests:
      storage: {{ .Values.wordpress.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordpress
spec:
  replicas: {{ .Values.wordpress.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-wordpress
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-wordpress
    spec:
      initContainers:
        - name: wait-for-mariadb
          image: {{ .Values.mariadb.image }}
          command:
            - /bin/sh
            - -c
            - |
              until mariadb-admin ping -h {{ .Release.Name }}-mariadb -u root -p"$MARIADB_ROOT_PASSWORD" --silent; do
                echo "Waiting for MariaDB..."
                sleep 3
              done
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: mariadb-root-password
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ .Release.Name }}-mariadb:3306"
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.mariadb.database | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: mariadb-password
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: wordpress-files
              mountPath: /var/www/html
          startupProbe:
            httpGet:
              path: /wp-login.php
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: wordpress-files
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-wordpress
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-wordpress
  ports:
    - name: http
      port: {{ .Values.wordpress.servicePort }}
      targetPort: http
