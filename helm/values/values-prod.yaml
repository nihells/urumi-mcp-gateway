# Production configuration template
# Replace the example hostname and storage class before deployment.

wordpress:
  image: wordpress:6.8.2-apache
  replicas: 1
  servicePort: 80
  storage: 10Gi
  storageClass: standard
  host: shop.example.com
  ingress:
    enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

mariadb:
  image: mariadb:11.4
  storage: 10Gi
  storageClass: standard
  database: wordpress
  user: wpuser
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

secrets:
  name: woo-platform-secrets

frontend:
  enabled: true
  image: urumi-frontend:0.1.0
  imagePullPolicy: IfNotPresent
  replicas: 2
  servicePort: 80
  host: dashboard.example.com

backend:
  enabled: true
  image: urumi-backend:0.1.0
  serviceName: urumi-backend
  servicePort: 8001

ingress:
  enabled: true
  className: nginx

gatewayResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi