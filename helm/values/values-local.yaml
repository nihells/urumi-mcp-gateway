wordpress:
  host: shop.urumi.local
  ingress:
    enabled: true

mariadb:
  storage: 2Gi
  storageClass: standard

frontend:
  enabled: true
  image: urumi-frontend:0.1.0
  imagePullPolicy: IfNotPresent
  replicas: 1
  servicePort: 80
  host: dashboard.urumi.local

backend:
  enabled: true
  image: urumi-backend:0.1.0
  serviceName: urumi-backend
  servicePort: 8001

ingress:
  enabled: true
  className: nginx

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi